<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pptx2html — Presentation Gallery</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .error-log {
        border: 1px solid #d9822b;
        background: #fff8ef;
        border-radius: 4px;
        padding: 0.5rem 1rem;
        margin: 1rem 0;
      }
      .error-log h2 {
        margin: 0.5rem 0;
        font-size: 1rem;
      }
      .error-log details {
        margin-bottom: 0.5rem;
      }
      .error-log summary {
        cursor: pointer;
        font-weight: 600;
      }
      .error-log ul {
        margin: 0.25rem 0 0.5rem 1.25rem;
        padding: 0;
      }
      .error-log li {
        font-size: 0.9rem;
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>pptx2html — Presentation Gallery</h1>
      <p>
        Pick a presentation below. Once it's loaded, click it or use the arrow keys to advance
        through its slides.
      </p>
      <div class="controls">
        <label for="demo-select">Presentation:</label>
        <select id="demo-select"></select>
      </div>
      <p id="status"></p>
      <div id="error-log" class="error-log" hidden></div>
      <div id="output"></div>
    </div>
  </body>
</html>
