<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pptx2html — Presentation Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #1a1a1a;
        background: #fff;
      }

      .view {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .view[hidden] {
        display: none;
      }

      .view-header {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: max(0.75rem, env(safe-area-inset-top)) 0.75rem 0.75rem;
        border-bottom: 1px solid #e0e0e0;
        background: #fff;
        z-index: 1;
      }

      .view-header h1 {
        flex: 1;
        margin: 0;
        font-size: 1.1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .icon-button {
        min-width: 2.75rem;
        min-height: 2.75rem;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fafafa;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
        position: relative;
      }

      .icon-button:active {
        background: #eee;
      }

      .badge {
        position: absolute;
        top: -0.4rem;
        right: -0.4rem;
        min-width: 1.25rem;
        height: 1.25rem;
        padding: 0 0.25rem;
        border-radius: 999px;
        background: #d9822b;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge[hidden] {
        display: none;
      }

      .view-body {
        flex: 1;
        padding: 0.75rem calc(0.75rem + env(safe-area-inset-right))
          calc(0.75rem + env(safe-area-inset-bottom)) calc(0.75rem + env(safe-area-inset-left));
        overflow-y: auto;
      }

      #view-chooser .view-body {
        max-width: 640px;
        margin: 0 auto;
        width: 100%;
      }

      #view-chooser h1 {
        font-size: 1.4rem;
      }

      #view-chooser p.intro {
        color: #555;
      }

      .demo-list {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .demo-button {
        width: 100%;
        min-height: 3rem;
        padding: 0.75rem 1rem;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        background: #fafafa;
        font-size: 1rem;
        text-align: left;
        cursor: pointer;
      }

      .demo-button:active {
        background: #eee;
      }

      .empty-state {
        color: #777;
      }

      /* The presentation view fills the whole screen edge-to-edge. Its header floats as a
         translucent overlay (not in document flow, unlike the other two views' headers) so it
         never shrinks the presentation's own screen space — but unlike those other headers it's
         hidden by default and only appears once the bars button below is tapped, so nothing but
         the slide itself is on screen normally. */
      #view-presentation {
        position: relative;
      }
      #view-presentation .view-header {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
      }
      #view-presentation.show-ui .view-header {
        display: flex;
      }
      #view-presentation .view-body {
        padding: 0;
        overflow: hidden;
        position: relative;
      }

      /* The one control left always on screen — everything else lives behind it in the header
         overlay above. Positioned in the corner least likely to sit over slide content, and kept
         small/translucent so it reads as chrome rather than part of the deck. */
      .ui-toggle-button {
        position: absolute;
        bottom: calc(1rem + env(safe-area-inset-bottom));
        right: calc(1rem + env(safe-area-inset-right));
        z-index: 3;
        width: 2.75rem;
        height: 2.75rem;
        border: none;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 1.2rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .ui-toggle-button:active {
        background: rgba(0, 0, 0, 0.75);
      }

      .header-titles {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.1rem;
      }
      .header-titles h1 {
        flex: none;
        margin: 0;
        font-size: 1.1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #status {
        margin: 0;
        color: #555;
        font-size: 0.8rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .text-button {
        min-width: auto;
        padding: 0 0.75rem;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .presentation-container {
        position: absolute;
        inset: 0;
      }
      .presentation-container > * {
        width: 100%;
        height: 100%;
      }

      .error-log h2 {
        margin: 0.5rem 0;
        font-size: 1rem;
      }

      .error-log details {
        margin-bottom: 0.5rem;
      }

      .error-log summary {
        cursor: pointer;
        font-weight: 600;
        padding: 0.5rem 0;
      }

      .error-log ul {
        margin: 0.25rem 0 0.5rem 1.25rem;
        padding: 0;
      }

      .error-log li {
        font-size: 0.9rem;
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="view-chooser" class="view">
        <div class="view-body">
          <h1>pptx2html — Presentation Gallery</h1>
          <p class="intro">Pick a presentation to view it.</p>
          <ul id="demo-list" class="demo-list"></ul>
        </div>
      </section>

      <section id="view-presentation" class="view" hidden>
        <header class="view-header">
          <button id="back-to-chooser" class="icon-button" aria-label="Back to list">←</button>
          <div class="header-titles">
            <h1 id="presentation-title"></h1>
            <p id="status"></p>
          </div>
          <button id="mode-toggle" class="icon-button text-button" type="button">Click</button>
          <button
            id="fullscreen-btn"
            class="icon-button"
            aria-label="Toggle fullscreen"
            type="button"
          >
            ⛶
          </button>
          <button id="open-error-log" class="icon-button" aria-label="View error log">
            ⚠<span id="error-log-badge" class="badge" hidden>0</span>
          </button>
        </header>
        <div class="view-body">
          <div id="output" class="presentation-container"></div>
        </div>
        <button id="ui-toggle" class="ui-toggle-button" type="button" aria-label="Show controls">
          ☰
        </button>
      </section>

      <section id="view-log" class="view" hidden>
        <header class="view-header">
          <button id="back-to-presentation" class="icon-button" aria-label="Back to presentation">
            ←
          </button>
          <h1>Error log</h1>
        </header>
        <div class="view-body">
          <div id="error-log-content" class="error-log"></div>
        </div>
      </section>
    </div>
  </body>
</html>
