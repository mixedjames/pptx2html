<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pptx2html web demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* The presentation fills the whole viewport; #chrome/#unsupported-features float on top of
         it rather than taking up their own document-flow space. */
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #111;
      }
      #stage:fullscreen {
        width: 100%;
        height: 100%;
      }

      #output {
        position: absolute;
        inset: 0;
      }
      /* Fills #output regardless of mode — PptxScrollPresentationElement needs an explicit box
         (see its own doc comment); PptxPresentationElement's own aspect-ratio-locked slide sizing
         already letterboxes within whatever box it's given, so this is a safe default for both. */
      #output > * {
        width: 100%;
        height: 100%;
      }

      #chrome {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1rem;
        padding: 0.4rem 0.75rem;
        background: rgba(17, 17, 17, 0.65);
        backdrop-filter: blur(6px);
        color: #f4f4f4;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      #chrome .title {
        font-weight: 600;
        white-space: nowrap;
      }
      #chrome button {
        font: inherit;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 0.2rem 0.6rem;
        cursor: pointer;
      }
      #chrome button:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      #mode-fieldset {
        display: inline-flex;
        gap: 0.75rem;
        align-items: center;
        border: none;
        padding: 0;
        margin: 0;
      }
      #mode-fieldset legend {
        /* Kept for accessibility (still announced by screen readers); visually redundant next to
           the "Click"/"Scroll" labels themselves in this compact bar. */
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      #status {
        margin: 0;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #unsupported-features {
        position: absolute;
        top: 2.75rem;
        right: 0.75rem;
        z-index: 10;
        max-width: 22rem;
        max-height: 70vh;
        overflow: auto;
        border: 1px solid #d9822b;
        background: #fff8ef;
        border-radius: 4px;
        padding: 0.5rem 1rem;
      }
      #unsupported-features .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0.5rem 0;
      }
      #unsupported-features .heading h2 {
        margin: 0;
        font-size: 1rem;
      }
      #unsupported-features .close-button {
        flex: none;
        width: 1.5rem;
        height: 1.5rem;
        line-height: 1;
        border: 1px solid #d9822b;
        border-radius: 4px;
        background: #fff;
        color: #d9822b;
        font-size: 1rem;
        cursor: pointer;
      }
      #unsupported-features .close-button:hover {
        background: #fdebd3;
      }
      #unsupported-features details {
        margin-bottom: 0.5rem;
      }
      #unsupported-features summary {
        cursor: pointer;
        font-weight: 600;
      }
      #unsupported-features ul {
        margin: 0.25rem 0 0.5rem 1.25rem;
        padding: 0;
      }
      #unsupported-features li {
        font-size: 0.9rem;
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="output"></div>
      <div id="chrome">
        <span class="title">pptx2html</span>
        <input id="file-input" type="file" accept=".pptx" />
        <fieldset id="mode-fieldset">
          <legend>Playback mode</legend>
          <label><input type="radio" name="mode" value="click" checked /> Click</label>
          <label><input type="radio" name="mode" value="scroll" /> Scroll</label>
        </fieldset>
        <button id="fullscreen-btn" type="button">Fullscreen</button>
        <p id="status"></p>
      </div>
      <div id="unsupported-features" hidden></div>
    </div>
  </body>
</html>
